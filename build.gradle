plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = "${mod_version}+${minecraft_version}-neoforge"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

// Complicated Bees, Create (with the Flywheel, Ponder and Registrate jars it carries inside) and Jade are
// compiled against their release jars in libs/, which tools/fetch_libs.sh fills. Nothing from them ends up
// in the built jar. JEI's API comes from its maven. All of them are compileOnly: which mods are present at
// runtime is decided by the mods/ folder of each run (tools/set_mods.sh), so every combination can be booted.
def libJar = { String name ->
    def f = file("libs/${name}")
    if (!f.exists()) throw new GradleException("libs/${name} is missing: run tools/fetch_libs.sh first")
    return f
}

dependencies {
    compileOnly files(libJar(cb_jar))
    compileOnly files(libJar(create_jar))
    compileOnly fileTree(dir: 'libs/nested', include: '*.jar')
    compileOnly files(libJar(jade_jar))
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
}

// Dev-only GameTests: a second mod, apiflux_gametest, loaded only in the gameTestServer run. None of it ships.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
dependencies {
    gametestCompileOnly files(libJar(cb_jar))
    gametestCompileOnly files(libJar(create_jar))
    gametestCompileOnly fileTree(dir: 'libs/nested', include: '*.jar')
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'apiflux_gametest'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            jvmArgument '-Xmx3G'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        apiflux_gametest {
            sourceSet(sourceSets.gametest)
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.gametest)

// The normal runs load only the shipped mod. `runClient -Pclienttest=1` adds the test mod, which hides the
// window and runs the scripted client check (tools/run_client_check.sh).
neoForge.runs.server.loadedMods = [neoForge.mods.apiflux]
neoForge.runs.gameTestServer.loadedMods = [neoForge.mods.apiflux, neoForge.mods.apiflux_gametest]
if (project.hasProperty('clienttest')) {
    neoForge.runs.client.loadedMods = [neoForge.mods.apiflux, neoForge.mods.apiflux_gametest]
    neoForge.runs.client.systemProperty 'apiflux.clienttest', 'true'
} else {
    neoForge.runs.client.loadedMods = [neoForge.mods.apiflux]
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
